plugins {
    id 'com.android.application'
}

android {
    namespace 'com.termux.tailscale'
    compileSdk 34

    defaultConfig {
        applicationId "com.termux.tailscale"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            // GitHub Actions injects these as env vars (see workflow)
            storeFile     file(System.getenv("KEYSTORE_PATH") ?: "debug.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "android"
            keyAlias      System.getenv("KEY_ALIAS")         ?: "androiddebugkey"
            keyPassword   System.getenv("KEY_PASSWORD")      ?: "android"
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // ── Tailscale Go backend AAR ───────────────────────────────────────────
    // After running `git submodule update --init` and building the AAR:
    // implementation files('../tailscale-android/build/outputs/aar/tailscale-release.aar')
    //
    // For now we stub VpnService.java — uncomment above once submodule builds.
}
