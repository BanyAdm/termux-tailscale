name: Build APK

on:
  push:
    branches: [main]
  # workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tailscale-android fork
        uses: actions/checkout@v4
        with:
          repository: banyadm/tailscale-android
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Checkout termux-tailscale scripts
        uses: actions/checkout@v4
        with:
          repository: banyadm/termux-tailscale
          path: termux-tailscale-scripts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;23.1.7779620"

      - name: Patch manifest
        run: python3 termux-tailscale-scripts/scripts/patch_repo.py



      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-v2-${{ hashFiles('**/go.sum') }}


      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Build libtailscale AAR
        run: make libtailscale

      - name: Generate tailscale.version
        run: make tailscale.version

      - name: Build release APK
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > keystore.jks
          cd android && ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$(pwd)/../keystore.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-termux-release
          path: android/build/outputs/apk/release/*.apk
