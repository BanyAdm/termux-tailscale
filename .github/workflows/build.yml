name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tailscale-android fork
        uses: actions/checkout@v4
        with:
          repository: banyadm/tailscale-android
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;23.1.7779620"

      - name: Patch repo
        run: |
          python3 << 'PYEOF'
          import re

          # 1. Add sharedUserId to manifest
          with open('android/src/main/AndroidManifest.xml') as f:
              c = f.read()
          if 'sharedUserId' not in c:
              c = c.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android"',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android"\n    android:sharedUserId="com.termux"'
              )
          # 2. Add receivers before </application>
          receiver_xml = '''
          <receiver android:name=".TermuxPluginReceiver" android:exported="true">
              <intent-filter>
                  <action android:name="com.tailscale.ipn.TERMUX_UP"/>
                  <action android:name="com.tailscale.ipn.TERMUX_DOWN"/>
                  <action android:name="com.tailscale.ipn.TERMUX_TOGGLE"/>
                  <action android:name="com.tailscale.ipn.TERMUX_STATUS"/>
              </intent-filter>
          </receiver>
          <receiver android:name=".TermuxBootReceiver" android:exported="true">
              <intent-filter>
                  <action android:name="android.intent.action.BOOT_COMPLETED"/>
              </intent-filter>
          </receiver>
          '''
          if 'TermuxPluginReceiver' not in c:
              c = c.replace('</application>', receiver_xml + '\n    </application>')
          with open('android/src/main/AndroidManifest.xml', 'w') as f:
              f.write(c)
          print("Manifest patched")
          PYEOF

      - name: Add TermuxPluginReceiver
        run: |
          cat > android/src/main/java/com/tailscale/ipn/TermuxPluginReceiver.java << 'JAVA'
          package com.tailscale.ipn;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.net.VpnService;
          import android.util.Log;
          import java.io.File;
          import java.io.FileWriter;
          import java.io.IOException;
          public class TermuxPluginReceiver extends BroadcastReceiver {
              private static final String TAG = "TS:TermuxPlugin";
              public static final String ACTION_UP     = "com.tailscale.ipn.TERMUX_UP";
              public static final String ACTION_DOWN   = "com.tailscale.ipn.TERMUX_DOWN";
              public static final String ACTION_TOGGLE = "com.tailscale.ipn.TERMUX_TOGGLE";
              public static final String ACTION_STATUS = "com.tailscale.ipn.TERMUX_STATUS";
              @Override
              public void onReceive(Context ctx, Intent intent) {
                  if (intent == null || intent.getAction() == null) return;
                  Log.i(TAG, "onReceive: " + intent.getAction());
                  UninitializedApp app = UninitializedApp.get();
                  switch (intent.getAction()) {
                      case ACTION_UP:
                          if (VpnService.prepare(ctx) != null) { Log.w(TAG, "VPN not prepared"); return; }
                          app.startVPN();
                          break;
                      case ACTION_DOWN:
                          app.stopVPN();
                          break;
                      case ACTION_TOGGLE:
                          if (VpnService.prepare(ctx) != null) { Log.w(TAG, "VPN not prepared"); return; }
                          if (isConnected()) { app.stopVPN(); } else { app.startVPN(); }
                          break;
                      case ACTION_STATUS:
                          writeStatus(ctx, isConnected());
                          break;
                  }
              }
              private boolean isConnected() {
                  try {
                      java.net.NetworkInterface tun = java.net.NetworkInterface.getByName("tun0");
                      return tun != null && tun.isUp();
                  } catch (Exception e) { return false; }
              }
              private void writeStatus(Context ctx, boolean connected) {
                  String status = connected ? "connected" : "disconnected";
                  File f = new File(ctx.getFilesDir(), "termux_status");
                  try (FileWriter w = new FileWriter(f)) { w.write(status + "\n"); } catch (IOException e) { Log.e(TAG, "status write failed", e); }
                  Intent result = new Intent("com.tailscale.ipn.TERMUX_STATUS_RESULT");
                  result.putExtra("connected", connected);
                  result.putExtra("status", status);
                  ctx.sendBroadcast(result);
              }
          }
          JAVA

      - name: Add TermuxBootReceiver
        run: |
          cat > android/src/main/java/com/tailscale/ipn/TermuxBootReceiver.java << 'JAVA'
          package com.tailscale.ipn;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.net.VpnService;
          import android.util.Log;
          public class TermuxBootReceiver extends BroadcastReceiver {
              private static final String TAG = "TS:TermuxBoot";
              @Override
              public void onReceive(Context ctx, Intent intent) {
                  if (VpnService.prepare(ctx) != null) { Log.i(TAG, "VPN not prepared, skipping"); return; }
                  UninitializedApp.get().startVPN();
              }
          }
          JAVA

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ hashFiles("**/go.sum") }}

      - name: Cache NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/23.1.7779620
          key: ndk-23.1.7779620

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Build libtailscale AAR
        run: make libtailscale

      - name: Generate tailscale.version
        run: make tailscale.version

      - name: Build release APK
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > keystore.jks
          cd android && ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$(pwd)/../keystore.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-termux-release
          path: android/build/outputs/apk/release/*.apk
