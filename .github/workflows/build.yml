name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:   # lets you trigger manually from the GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout with submodules ────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive   # pulls tailscale-android submodule

      # ── 2. Java 17 ────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Go (needed to build Tailscale Go backend) ──────────────────────
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # ── 4. Android SDK ─────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 5. Build Tailscale AAR from submodule ──────────────────────────────
      #    (comment this step out until you're ready to wire in the Go backend)
      # - name: Build Tailscale AAR
      #   working-directory: tailscale-android
      #   run: |
      #     make aar

      # ── 6. Gradle cache ────────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}

      # ── 7. Build debug APK ─────────────────────────────────────────────────
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      # ── 8. Build & sign release APK (only on push to main) ────────────────
      - name: Build release APK
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_PATH:     ${{ secrets.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # ── 9. Upload APKs as build artifacts ──────────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: termux-tailscale-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: termux-tailscale-release
          path: app/build/outputs/apk/release/*.apk
